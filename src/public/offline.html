<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Offline — FootballStore</title>
  <link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
  <style>body { font-family: sans-serif; background: #0f0f1a; color: #e5e7eb; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="text-center">
    <div class="text-8xl mb-6">📶</div>
    <h1 class="text-3xl font-black text-white mb-3">You're Offline</h1>
    <p class="text-gray-400 mb-6">Check your internet connection and try again.</p>
    <button onclick="window.location.reload()" class="bg-yellow-500 text-gray-900 px-6 py-3 rounded-xl font-bold hover:bg-yellow-400 transition-colors">
      Try Again
    </button>
  </div>
</body>
</html>
